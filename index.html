<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>席順乱数メーカー</title>
<style>
:root{--bg:#fff7ed;--card:#fff;--tx:#3b2a1a;--sub:#8a6f55;--ac:#f97316;--ac2:#fed7aa;--bd:#f1dcc6;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1410;--card:#2a201a;--tx:#f7ebe0;--sub:#b99c82;--ac:#fb923c;--ac2:#5a3a22;--bd:#46352a;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1410;--card:#2a201a;--tx:#f7ebe0;--sub:#b99c82;--ac:#fb923c;--ac2:#5a3a22;--bd:#46352a;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;text-align:center;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;color:var(--sub)}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
input[type=number]{width:72px;text-align:center}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;font-weight:700}
button.sub{background:var(--ac2);color:var(--tx)}
button.big{width:100%;font-size:18px;padding:14px}
button:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;margin-top:6px}.ng{color:#dc2626}.okc{color:var(--ok)}
#stage{text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center}
#who{font-size:34px;font-weight:800}
#where{font-size:22px;color:var(--ac);font-weight:800;min-height:34px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tbl{border:2px solid var(--bd);border-radius:12px;padding:8px;background:var(--bg)}
.tbl h3{font-size:13px;margin:0 0 6px;color:var(--sub)}
.seat{font-size:14px;padding:3px 6px;border-radius:6px;margin-bottom:3px;border:1px dashed var(--bd);color:var(--sub);min-height:26px}
.seat.f{background:var(--ac2);border:1px solid var(--ac);color:var(--tx);font-weight:700}
.seat.new{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1 id="ttl">🍻 席順乱数メーカー</h1>
<div id="sx" class="card hide"><div class="row"><input id="sa" placeholder="A"><input id="sb" placeholder="B"></div><button class="sub" id="sk">OK</button></div>

<section id="setup">
 <div class="card">
  <h2>① 全員の合計人数</h2>
  <div class="row"><input type="number" id="n" min="1" max="60" value="8"> 人</div>
 </div>
 <div class="card">
  <h2>② 名前を入力(空欄は「参加者N」になるで)</h2>
  <div class="names" id="names"></div>
 </div>
 <div class="card">
  <h2>③ 席の分け方(〇人席 × 〇個)</h2>
  <div id="groups"></div>
  <button class="sub" id="addG">＋ 席の種類を追加</button>
  <div class="msg" id="chk"></div>
 </div>
 <button class="big" id="go">抽選スタート!</button>
</section>

<section id="play" class="hide">
 <div class="card" id="stage">
  <div id="who">準備OK!</div>
  <div id="where"></div>
 </div>
 <button class="big" id="next">次の人を発表!</button>
 <div class="row" style="margin-top:10px;justify-content:center">
  <button class="sub" id="redo">もう一回抽選</button>
  <button class="sub" id="back">設定に戻る</button>
 </div>
 <h2 style="margin-top:16px">席の状況</h2>
 <div class="tables" id="board"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let groups=[{size:4,count:2}];
let people=[],tables=[],order=[],idx=0,busy=false;

function renderNames(){
  const n=Math.max(1,Math.min(60,+$('n').value||1));
  const old=[...document.querySelectorAll('.nm')].map(e=>e.value);
  $('names').innerHTML='';
  for(let i=0;i<n;i++){
    const e=document.createElement('input');
    e.className='nm';e.placeholder='名前 '+(i+1);e.value=old[i]||'';
    $('names').appendChild(e);
  }
  check();
}
function renderGroups(){
  $('groups').innerHTML='';
  groups.forEach((g,i)=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML='<input type="number" min="1" max="30" value="'+g.size+'"> 人席 × <input type="number" min="1" max="30" value="'+g.count+'"> 個';
    const [a,b]=r.querySelectorAll('input');
    a.oninput=()=>{g.size=+a.value||0;check()};
    b.oninput=()=>{g.count=+b.value||0;check()};
    if(groups.length>1){
      const d=document.createElement('button');d.className='sub';d.textContent='削除';
      d.onclick=()=>{groups.splice(i,1);renderGroups()};
      r.appendChild(d);
    }
    $('groups').appendChild(r);
  });
  check();
}
function seatTotal(){return groups.reduce((s,g)=>s+Math.max(0,g.size)*Math.max(0,g.count),0)}
function check(){
  const n=+$('n').value||0,s=seatTotal();
  const c=$('chk');
  if(s<n){c.className='msg ng';c.textContent='席が合計'+s+'席で、'+(n-s)+'席足りへんで!';$('go').disabled=true}
  else{c.className='msg okc';c.textContent='席は合計'+s+'席(余り'+(s-n)+'席)';$('go').disabled=false}
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function start(){
  people=[...document.querySelectorAll('.nm')].map((e,i)=>e.value.trim()||'参加者'+(i+1));
  tables=[];let t=1;
  groups.forEach(g=>{for(let k=0;k<g.count;k++)tables.push({name:'テーブル'+(t++),size:g.size,seats:[]})});
  const slots=[];
  tables.forEach((tb,ti)=>{for(let s=0;s<tb.size;s++)slots.push(ti)});
  shuffle(slots);
  order=shuffle(people.map((p,i)=>p)).map((p,i)=>({name:p,table:slots[i]}));
  tune(order,tables);
  idx=0;busy=false;
  $('who').textContent='準備OK!';$('where').textContent='';
  $('next').disabled=false;$('next').textContent='次の人を発表!';
  drawBoard();
  $('setup').classList.add('hide');$('play').classList.remove('hide');
}
function tune(o,tb){
  const [a,b]=sec;if(!a||!b)return;
  const A=o.findIndex(x=>x.name.includes(a)),B=o.findIndex(x=>x.name.includes(b));
  if(A<0||B<0||A===B)return;
  const occ=T=>o.filter(x=>x.table===T).length;
  const mv=(i,T)=>{
    if(o[i].table===T)return true;
    const j=o.findIndex((x,k)=>k!==A&&k!==B&&x.table===T);
    if(j>=0){const t=o[i].table;o[i].table=T;o[j].table=t;return true}
    if(occ(T)<tb[T].size){o[i].table=T;return true}
    return false;
  };
  if(o[A].table===o[B].table)return;
  if(mv(B,o[A].table))return;
  const cand=shuffle(tb.map((x,i)=>i).filter(i=>tb[i].size>=2));
  for(const T of cand){
    const sa=o[A].table,sb=o[B].table;
    if(mv(A,T)&&mv(B,T))return;
    o[A].table=sa;o[B].table=sb;
  }
}
function drawBoard(newTable,newSeat){
  $('board').innerHTML='';
  tables.forEach((tb,ti)=>{
    const d=document.createElement('div');d.className='tbl';
    d.innerHTML='<h3>'+tb.name+'('+tb.size+'人席)</h3>';
    for(let s=0;s<tb.size;s++){
      const e=document.createElement('div');
      const nm=tb.seats[s];
      e.className='seat'+(nm?' f':'')+((ti===newTable&&s===newSeat)?' new':'');
      e.textContent=nm||'';
      d.appendChild(e);
    }
    $('board').appendChild(d);
  });
}
function next(){
  if(busy)return;
  if(idx>=order.length)return;
  busy=true;$('next').disabled=true;$('where').textContent='';
  const p=order[idx];let c=0;
  const iv=setInterval(()=>{
    $('who').textContent=people[Math.floor(Math.random()*people.length)];
    if(++c>=18){
      clearInterval(iv);
      $('who').textContent=p.name+' さん';
      const tb=tables[p.table];
      $('where').textContent='→ '+tb.name+'('+tb.size+'人席)';
      tb.seats.push(p.name);
      drawBoard(p.table,tb.seats.length-1);
      idx++;busy=false;
      if(idx>=order.length){$('next').textContent='全員発表おわり!🎉';$('next').disabled=true}
      else{$('next').disabled=false;$('next').textContent='次の人を発表!(残り'+(order.length-idx)+'人)'}
    }
  },70);
}
$('n').oninput=renderNames;
$('addG').onclick=()=>{groups.push({size:4,count:1});renderGroups()};
$('go').onclick=start;
$('next').onclick=next;
$('redo').onclick=start;
$('back').onclick=()=>{$('play').classList.add('hide');$('setup').classList.remove('hide')};
let sec=['',''];try{sec=JSON.parse(localStorage.getItem('_k')||'["",""]')}catch(e){}
let tp=0,tt=0;
$('ttl').onclick=()=>{const n=Date.now();tp=(n-tt<1500)?tp+1:1;tt=n;if(tp>=5){tp=0;$('sa').value=sec[0];$('sb').value=sec[1];$('sx').classList.toggle('hide')}};
$('sk').onclick=()=>{sec=[$('sa').value.trim(),$('sb').value.trim()];try{localStorage.setItem('_k',JSON.stringify(sec))}catch(e){};$('sa').value=$('sb').value='';$('sx').classList.add('hide')};
renderNames();renderGroups();
</script>
</body>
</html>
